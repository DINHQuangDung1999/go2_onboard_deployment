# rl_kp[0]  → hardware 3  → FL hip
# rl_kp[1]  → hardware 0  → FR hip
# rl_kp[2]  → hardware 9  → RL hip
# rl_kp[3]  → hardware 6  → RR hip

# rl_kp[4]  → hardware 4  → FL thigh
# rl_kp[5]  → hardware 1  → FR thigh
# rl_kp[6]  → hardware 10 → RL thigh
# rl_kp[7]  → hardware 7  → RR thigh

# rl_kp[8]  → hardware 5  → FL calf
# rl_kp[9]  → hardware 2  → FR calf
# rl_kp[10] → hardware 11 → RL calf
# rl_kp[11] → hardware 8  → RR calf
go2/model999:
        model_name: "policy.onnx"
        # Quadloco actor contract: current 45-value observation plus 30 frames of
        # oldest-to-newest observation history.
        model_forward_mode: "single"
        num_observations: 45
        # history_length: 30
        # warm_start_history: true
        observations_history: []
        # observations_history_priority: "time"

        observations: ["dof_pos", "dof_vel", "actions", "ang_vel", "gravity_vec", "commands"]
        clip_obs: 2.5
        ang_vel_scale: 0.2
        dof_pos_scale: 1.0
        dof_vel_scale: 0.05
        commands_scale: [1.0, 1.0, 1.0]
        num_of_dofs: 12
        clip_actions_lower: [-2.5, -2.5, -2.5,
                        -2.5, -2.5, -2.5,
                        -2.5, -2.5, -2.5,
                        -2.5, -2.5, -2.5]
        clip_actions_upper: [2.5, 2.5, 2.5,
                        2.5, 2.5, 2.5,
                        2.5, 2.5, 2.5,
                        2.5, 2.5, 2.5]
        action_scale: [0.25, 0.25, 0.25, 0.25,
                0.25, 0.25, 0.25, 0.25,
                0.25, 0.25, 0.25, 0.25]
        rl_kp: [25.0, 25.0, 25.0,
                25.0, 25.0, 25.0,
                25.0, 25.0, 25.0,
                25.0, 25.0, 25.0]
        rl_kd: [0.5, 0.5, 0.5,
                0.5, 0.5, 0.5,
                0.5, 0.5, 0.5,
                0.5, 0.5, 0.5]
        wheel_indices: []

        default_dof_pos: [0.10, -0.10, 0.10, -0.10,
                        0.80, 0.80, 1.00, 1.00,
                        -1.50, -1.50, -1.50, -1.50]
        joint_mapping: [3, 0, 9, 6,
                        4, 1, 10, 7,
                        5, 2, 11, 8]
        joint_pos_limit_lower: [-1.0472, -1.0472, -1.0472, -1.0472,
                                -1.5708, -1.5708, -0.5236, -0.5236,
                                -2.7227, -2.7227, -2.7227, -2.7227]
        joint_pos_limit_upper: [1.0472, 1.0472, 1.0472, 1.0472,
                                3.4907, 3.4907, 4.5379, 4.5379,
                                -0.83776, -0.83776, -0.83776, -0.83776]

        hold_zero_command: false
        stand_command_threshold: 0.02
        torque_limits: [23.5, 23.5, 23.5,
                        23.5, 23.5, 23.5,
                        23.5, 23.5, 23.5,
                        23.5, 23.5, 23.5]
        validate_model_on_load: true
